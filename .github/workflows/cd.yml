name: "CD — ${{ github.sha }}"

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]


jobs:
  deploy:
    name: build and deploy on minikube
    runs-on: self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: start minikube
        run: minikube start
      - name: point docker to minikube
        run: |
          minikube -p minikube docker-env --shell powershell | Out-File -Encoding utf8 docker-env.ps1
          . .\docker-env.ps1
      - name: build docker image
        run: docker build -t leadspot:latest .
      - name: Create kubernetes secrets 
        run: |
          kubectl delete secret leadspot-env --ignore-not-found
          kubectl create secret generic leadspot-env `
            --from-literal=NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" `
            --from-literal=NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" `
            --from-literal=SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" `
            --from-literal=GEOAPIFY_API_KEY="${{ secrets.GEOAPIFY_API_KEY }}" `
            --from-literal=UPSTASH_REDIS_REST_URL="${{ secrets.UPSTASH_REDIS_REST_URL }}" `
            --from-literal=UPSTASH_REDIS_REST_TOKEN="${{ secrets.UPSTASH_REDIS_REST_TOKEN }}" `
            --from-literal=QSTASH_TOKEN="${{ secrets.QSTASH_TOKEN }}" `
            --from-literal=RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" `
            --from-literal=NEXT_PUBLIC_MAP_TILES_API_KEY="${{ secrets.NEXT_PUBLIC_MAP_TILES_API_KEY }}" `
            --from-literal=NEXT_PUBLIC_VAPID_PUBLIC_KEY="${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}" `
            --from-literal=VAPID_PRIVATE_KEY="${{ secrets.VAPID_PRIVATE_KEY }}" `
            --from-literal=FREE_TIER_MONTHLY_SEARCH_LIMIT="10" `
            --from-literal=NEXT_PUBLIC_APP_URL="http://localhost:30080"
      - name: enable ingress addon
        run: minikube addons enable ingress
      - name: add hosts entry
        run: |
          $hosts = Get-Content "C:\Windows\System32\drivers\etc\hosts"
          if ($hosts -notcontains "127.0.0.1  leadspot.local") {
            Add-Content -Path "C:\Windows\System32\drivers\etc\hosts" -Value "`n127.0.0.1  leadspot.local"
          }
      - name: Deploy to minikube
        run: |
          helm upgrade --install leadspot ./leadspot-chart `
            --set image.tag=latest `
            --set image.pullPolicy=Never `
            --set ingress.enabled=true `
            --wait --timeout 300s
      - name: start minikube tunnel
        run: Start-Process -NoNewWindow -FilePath "minikube" -ArgumentList "tunnel"
      - name: wait for ingress
        run: Start-Sleep -Seconds 10
            
      - name: verify deployement 
        run: |
          kubectl rollout status deployment/leadspot-leadspot-chart --timeout=60s
          kubectl get pods -l app.kubernetes.io/instance=leadspot
      - name: smoke test 
        run: |
          Start-Process -NoNewWindow -FilePath "kubectl" -ArgumentList "port-forward svc/leadspot-leadspot-chart 3000:3000"
          Start-Sleep -Seconds 15
          $response = Invoke-WebRequest -Uri http://localhost:3000 -UseBasicParsing
          if ($response.StatusCode -ne 200) {
            Write-Error "Smoke test failed with status $($response.StatusCode)"
            exit 1
          }
          Write-Host "Smoke test passed - Status: $($response.StatusCode)"

      - name: Rollback on failure
        if: failure()
        run: |
          Write-Host "Deployment failed. Rolling back..."
          helm rollback leadspot 0
          kubectl rollout status deployment/leadspot-leadspot-chart --timeout=60s
          kubectl get pods -l app.kubernetes.io/instance=leadspot
          
          

      - name: Job Summary
        if: always()
        run: |
          $ingressHost = kubectl get ingress leadspot-leadspot-chart -o jsonpath='{.spec.rules[0].host}' 2>$null
          $ingressUrl = if ($ingressHost) { "http://$ingressHost" } else { "N/A (port-forward: localhost:30080)" }
          $hpa = kubectl get hpa -l app.kubernetes.io/instance=leadspot --no-headers 2>$null
          $summary = @"
          ## Deploy Report
          | | |
          |---|---|
          | **Repo** | `${{ github.repository }}` |
          | **Branch** | `${{ github.ref_name }}` |
          | **Commit** | `${{ github.sha }}` |
          | **Triggered by** | `${{ github.actor }}` |
          | **Status** | `${{ job.status }}` |
          | **Time** | $(Get-Date -Format "yyyy-MM-dd HH:mm:ss") |
          | **App URL** | $ingressUrl |
          | **HPA** | $(if ($hpa) { $hpa } else { "Non configuré" }) |
          | **Cluster** | $(kubectl cluster-info | Select-String -Pattern 'is running at' | Out-String) |
          | **Pods** | $(kubectl get pods -l app.kubernetes.io/instance=leadspot --no-headers | Measure-Object -Line | Select-Object -ExpandProperty Lines) |
          "@
          echo $summary >> $env:GITHUB_STEP_SUMMARY